[project]
name = "snap-assistant"
version = "0.2.0"
description = "Deck-building assistant for Marvel Snap: validate decks, analyze curves, and suggest cards."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "mcp>=1.2,<2"]
mcp = ["mcp>=1.2,<2"]

[project.scripts]
snap-assistant = "snap_assistant.cli:main"
snap-assistant-mcp = "snap_assistant.mcp_server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
snap_assistant = ["data/*.json", "knowledge/*.md", "knowledge/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
