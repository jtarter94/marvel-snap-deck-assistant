[project]
name = "snap-assistant"
version = "0.1.0"
description = "Deck-building assistant for Marvel Snap: validate decks, analyze curves, and suggest cards."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
snap-assistant = "snap_assistant.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
snap_assistant = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
